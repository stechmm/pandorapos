<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandora Expenses - KDS & Market Expenses Tracker</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@100..900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Styling System - Glassmorphism matched with Pandora POS */
    :root {
      color-scheme: dark;
      --bg-gradient-start: #0a1931;
      --bg-gradient-end: #000c1f;
      --panel-bg: rgba(30, 48, 80, 0.45);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-brand-blue: #0b57a4;
      --accent-primary: #e5b72e;
      --accent-success: #10b981;
      --accent-danger: #ef4444;
      
      --border-radius-lg: 20px;
      --border-radius-md: 12px;
      --border-radius-sm: 8px;
      --input-bg: rgba(255, 255, 255, 0.07);
      --input-bg-focus: rgba(255, 255, 255, 0.11);
      --input-border: rgba(255, 255, 255, 0.12);
      --glass-blur: 16px;
      --shadow-lg: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg-gradient-start: #f0f4f8;
      --bg-gradient-end: #d9e2ec;
      --panel-bg: rgba(255, 255, 255, 0.7);
      --panel-border: rgba(11, 87, 164, 0.15);
      --text-primary: #0a1931;
      --text-secondary: #486581;
      --text-muted: #829ab1;
      
      --modal-bg: #ffffff;
      --input-bg: #f8fafc;
      --input-bg-focus: #ffffff;
      --input-border: #b0c4de;
    }

    html {
      font-size: 14.5px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans Myanmar', 'Pyidaungsu', 'Outfit', 'Padauk', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    header {
      background: var(--panel-bg);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--panel-border);
      border-radius: var(--border-radius-lg);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-lg);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1.5px solid var(--accent-primary);
      object-fit: contain;
    }

    .brand-name {
      font-weight: 800;
      line-height: 1.1;
      font-size: 1.15rem;
    }

    .brand-subtitle {
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.8;
      color: var(--accent-primary);
      letter-spacing: 0.5px;
    }

    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--panel-border);
      border-radius: var(--border-radius-sm);
      color: var(--text-primary);
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    /* Cards Layout */
    .card {
      background: var(--panel-bg);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--panel-border);
      border-radius: var(--border-radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-lg);
    }

    .card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--border-radius-md);
      padding: 11px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 8px rgba(229, 183, 46, 0.4);
      background: var(--input-bg-focus);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent-success);
      color: white;
      border: none;
      border-radius: var(--border-radius-md);
      padding: 13px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s;
      box-shadow: 0 5px 15px -5px rgba(16, 185, 129, 0.4);
    }

    .submit-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    /* Summary Section */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 5px;
    }

    .summary-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      border-radius: var(--border-radius-md);
      padding: 12px;
      text-align: center;
    }

    .summary-item h5 {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .summary-item div {
      font-size: 1.15rem;
      font-weight: 800;
    }

    /* List section */
    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .expense-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      border-radius: var(--border-radius-md);
      padding: 10px 12px;
      gap: 10px;
    }

    .expense-details {
      flex: 1;
    }

    .expense-details h4 {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .expense-details p {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .expense-cost {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent-success);
      white-space: nowrap;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: var(--accent-danger);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--accent-success);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- HEADER -->
    <header>
      <div class="brand-section">
        <img src="logo.png" class="brand-logo" alt="Pandora Logo">
        <div>
          <div class="brand-name">PANDORA</div>
          <div class="brand-subtitle">EXPENSES</div>
        </div>
      </div>
      
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="sync-badge" id="syncStatusBadge">
          <i class="fa-solid fa-cloud-arrow-up animate-pulse"></i> DB Sync
        </div>
        <button class="theme-toggle-btn" onclick="window.location.reload()" title="Live Sync ပြန်လည်စစ်ဆေးရန်">
          <i class="fa-solid fa-wifi"></i>
        </button>
        <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">
          <i class="fa-solid fa-sun"></i>
        </button>
      </div>
    </header>

    <!-- SUMMARY -->
    <div class="card">
      <div class="summary-grid">
        <div class="summary-item">
          <h5>ယနေ့ကုန်ကျစရိတ်</h5>
          <div id="sumTodayCost" style="color: var(--accent-primary);">0 MMK</div>
        </div>
        <div class="summary-item">
          <h5>ဝယ်ယူမှုအရေအတွက်</h5>
          <div id="sumTodayCount">0 ခု</div>
        </div>
      </div>
    </div>

    <!-- ADD EXPENSE CARD -->
    <div class="card">
      <h3><i class="fa-solid fa-cart-plus" style="color: var(--accent-primary);"></i> ဈေးဝယ်စရိတ် အသစ်ထည့်ရန်</h3>
      
      <form id="expenseForm" onsubmit="saveExpense(event)">
        <div class="form-group">
          <label for="expItemName">ကုန်ပစ္စည်း/စရိတ်အမည်</label>
          <input type="text" id="expItemName" class="form-control" placeholder="ဥပမာ - ကြက်ဥ၊ ဆီ" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="expCost">ကုန်ကျငွေ (Total Cost)</label>
            <input type="number" id="expCost" class="form-control" placeholder="ဥပမာ - 15000" min="0" required>
          </div>
          <div class="form-group">
            <label for="expCategory">အမျိုးအစား (Category)</label>
            <select id="expCategory" class="form-control" style="cursor: pointer;">
              <option value="ကုန်ကြမ်း">ကုန်ကြမ်း (Ingredients)</option>
              <option value="အထွေထွေ">အထွေထွေ (General)</option>
              <option value="ဝန်ထမ်း">ဝန်ထမ်းစရိတ် (Staff)</option>
              <option value="အသုံးအဆောင်">အသုံးအဆောင် (Utility)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="expQty">အရေအတွက် (Quantity)</label>
            <input type="number" id="expQty" class="form-control" step="any" placeholder="ဥပမာ - 5" required>
          </div>
          <div class="form-group">
            <label for="expUnit">ယူနစ်/ထုပ်ပိုးမှု (Unit)</label>
            <input type="text" id="expUnit" class="form-control" placeholder="ဥပမာ - ကတ်, kg, ထုပ်" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="expDate">ရက်စွဲ (Date)</label>
            <input type="date" id="expDate" class="form-control" required>
          </div>
          <div class="form-group" style="visibility: hidden; pointer-events: none;">
          </div>
        </div>

        <div class="form-group">
          <label for="expNotes">မှတ်ချက် (Optional)</label>
          <input type="text" id="expNotes" class="form-control" placeholder="အသေးစိတ်မှတ်ချက်...">
        </div>

        <!-- Inventory Link -->
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="expLinkInventory" onchange="toggleInventoryLink(this.checked)">
            <label for="expLinkInventory" style="margin: 0; cursor: pointer; color: var(--accent-primary);">
              စတော့ပစ္စည်းထဲသို့ တိုက်ရိုက်ထည့်မည်
            </label>
          </div>
        </div>

        <div id="expInventoryProductWrapper" style="display: none; border: 1.5px solid var(--panel-border); border-radius: var(--border-radius-md); padding: 12px; margin-bottom: 14px; background: rgba(0,0,0,0.15);">
          <div class="form-group">
            <label for="expProductSelect">ချိတ်ဆက်မည့် Product</label>
            <select id="expProductSelect" class="form-control" style="cursor: pointer;">
              <!-- Populated dynamically -->
            </select>
          </div>
          <div class="form-group" style="margin: 0;">
            <label for="expAddQty">စတော့ပေါင်းထည့်မည့် အရေအတွက်</label>
            <input type="number" id="expAddQty" class="form-control" placeholder="ဥပမာ - 10" min="1">
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fa-solid fa-save"></i> စရိတ်မှတ်တမ်းတင်မည်
        </button>
      </form>
    </div>

    <!-- RECENT EXPENSES CARD -->
    <div class="card" style="flex: 1;">
      <h3><i class="fa-solid fa-list-check" style="color: var(--accent-success);"></i> ယနေ့ ဝယ်ယူမှုမှတ်တမ်းများ</h3>
      <div class="expense-list" id="expenseListContainer">
        <!-- Logged expenses populated by JS -->
      </div>
    </div>

  </div>

  <!-- JavaScript logic to sync with the Namecheap PHP/MySQL service -->
  <script src="expenses_app.js"></script>
</body>
</html>
